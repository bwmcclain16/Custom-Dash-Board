[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motorsport-dashboard"
version = "0.1.0"
description = "Cross-platform CAN-driven motorsport dashboard editor and runtime"
readme = "README.md"
authors = [{ name = "OpenAI Codex" }]
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "python-can>=4.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
motorsport-dashboard = "motorsport_dashboard.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
